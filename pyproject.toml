[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiagent-mcp"
version = "0.1.0"
description = "Multi-Agent MCP Room for collaborative LLM dialogues and turn coordination"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "pydantic>=2.7.0",
    "starlette>=0.38.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
]

[project.scripts]
multiagent-mcp = "multiagent_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multiagent_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
